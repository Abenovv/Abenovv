name: Refresh profile

on:
  schedule:
    - cron: '23 0,12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - content/**
      - package.json
      - package-lock.json
      - assets/portrait-ascii.json
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Abenovv/Abenovv'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Fetch public metrics and render GitAscii dashboard
        run: node scripts/refresh.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Adapted from Mauro's snake workflow; pinned action and blue custom palette.
      - name: Generate blue contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Abenovv
          outputs: assets/contribution-snake.svg?color_snake=#74ccff&color_dots=#101e33,#17375e,#245c96,#398fce,#8bd8ff
      - name: Embed the current generated asset versions
        run: node scripts/render.mjs
      - name: Validate generated profile
        run: |
          node --test scripts/profile.test.mjs
          node scripts/validate.mjs
          python3 scripts/validate-svg.py
      - name: Commit refreshed assets when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md assets/dashboard.svg assets/dashboard-mobile.svg assets/dashboard-phone.svg assets/snake-title.svg assets/contribution-snake.svg assets/contribution-static.svg assets/profile-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile metrics and blue snake [skip ci]'
            git push origin HEAD:main
          fi
